<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<style>
@font-face{font-family:"DM Sans";font-weight:400;src:url(fonts/dm-sans-latin-400-normal.woff2)}
@font-face{font-family:"DM Sans";font-weight:700;src:url(fonts/dm-sans-latin-700-normal.woff2)}
@font-face{font-family:"DM Sans";font-weight:800;src:url(fonts/dm-sans-latin-800-normal.woff2)}
@font-face{font-family:"Marker";font-weight:400;src:url(fonts/permanent-marker-latin-400-normal.woff2)}
@font-face{font-family:"Anton";font-weight:400;src:url(fonts/anton-latin-400-normal.woff2)}
html,body{margin:0;background:#000;overflow:hidden}
#stage{display:block;width:1080px;height:1920px}
text{font-family:"DM Sans",sans-serif}
</style></head>
<body>
<svg id="stage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
 <defs>
  <filter id="sh" x="-25%" y="-25%" width="150%" height="160%" color-interpolation-filters="sRGB">
   <feGaussianBlur in="SourceAlpha" stdDeviation="1.6" result="bl"/>
   <feDiffuseLighting in="bl" surfaceScale="3.2" diffuseConstant="1.15" lighting-color="#fff" result="lt"><feDistantLight azimuth="235" elevation="52"/></feDiffuseLighting>
   <feTurbulence type="fractalNoise" baseFrequency=".55" numOctaves="3" seed="4" result="nz"/>
   <feColorMatrix in="nz" type="matrix" values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  .0 .0 .0 .0 1" result="g0"/>
   <feColorMatrix in="nz" type="matrix" values=".5 0 0 0 .55  .5 0 0 0 .55  .5 0 0 0 .55  0 0 0 0 1" result="fib"/>
   <feBlend in="SourceGraphic" in2="lt" mode="multiply" result="m1"/>
   <feBlend in="m1" in2="fib" mode="multiply" result="m2"/>
   <feComponentTransfer in="m2" result="m3"><feFuncR type="linear" slope="1.28"/><feFuncG type="linear" slope="1.28"/><feFuncB type="linear" slope="1.28"/></feComponentTransfer>
   <feComposite in="m3" in2="SourceAlpha" operator="in" result="body"/>
   <feDropShadow in="body" dx="2.7" dy="9" stdDeviation="6" flood-color="#2a1305" flood-opacity="0.38"/>
  </filter>
  <filter id="sh1" x="-40%" y="-40%" width="180%" height="190%" color-interpolation-filters="sRGB">
   <feGaussianBlur in="SourceAlpha" stdDeviation="1.1" result="bl"/>
   <feDiffuseLighting in="bl" surfaceScale="2.2" diffuseConstant="1.15" lighting-color="#fff" result="lt"><feDistantLight azimuth="235" elevation="52"/></feDiffuseLighting>
   <feTurbulence type="fractalNoise" baseFrequency=".55" numOctaves="3" seed="4" result="nz"/>
   <feColorMatrix in="nz" type="matrix" values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  .0 .0 .0 .0 1" result="g0"/>
   <feColorMatrix in="nz" type="matrix" values=".5 0 0 0 .55  .5 0 0 0 .55  .5 0 0 0 .55  0 0 0 0 1" result="fib"/>
   <feBlend in="SourceGraphic" in2="lt" mode="multiply" result="m1"/>
   <feBlend in="m1" in2="fib" mode="multiply" result="m2"/>
   <feComponentTransfer in="m2" result="m3"><feFuncR type="linear" slope="1.28"/><feFuncG type="linear" slope="1.28"/><feFuncB type="linear" slope="1.28"/></feComponentTransfer>
   <feComposite in="m3" in2="SourceAlpha" operator="in" result="body"/>
   <feDropShadow in="body" dx="1.1" dy="3.5" stdDeviation="2.6" flood-color="#2a1305" flood-opacity="0.45"/>
  </filter>
  <filter id="sh2" x="-30%" y="-30%" width="160%" height="170%" color-interpolation-filters="sRGB">
   <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="bl"/>
   <feDiffuseLighting in="bl" surfaceScale="4.5" diffuseConstant="1.15" lighting-color="#fff" result="lt"><feDistantLight azimuth="235" elevation="52"/></feDiffuseLighting>
   <feTurbulence type="fractalNoise" baseFrequency=".55" numOctaves="3" seed="4" result="nz"/>
   <feColorMatrix in="nz" type="matrix" values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  .0 .0 .0 .0 1" result="g0"/>
   <feColorMatrix in="nz" type="matrix" values=".5 0 0 0 .55  .5 0 0 0 .55  .5 0 0 0 .55  0 0 0 0 1" result="fib"/>
   <feBlend in="SourceGraphic" in2="lt" mode="multiply" result="m1"/>
   <feBlend in="m1" in2="fib" mode="multiply" result="m2"/>
   <feComponentTransfer in="m2" result="m3"><feFuncR type="linear" slope="1.28"/><feFuncG type="linear" slope="1.28"/><feFuncB type="linear" slope="1.28"/></feComponentTransfer>
   <feComposite in="m3" in2="SourceAlpha" operator="in" result="body"/>
   <feDropShadow in="body" dx="4.8" dy="16" stdDeviation="11" flood-color="#2a1305" flood-opacity="0.42"/>
  </filter>
  <pattern id="corr" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(32)"><line x1="0" y1="0" x2="0" y2="16" stroke="#2a1305" stroke-opacity=".10" stroke-width="6"/></pattern>
  <clipPath id="peelClip"><path id="peelPath" d="M0,0H1080V1920H0Z"/></clipPath>
 </defs>
 <image href="kraft.jpg" x="0" y="0" width="1080" height="1920"/>
 <g id="art" transform="translate(-54,-10) scale(1.1)"><g id="scenes"></g></g>
 <image href="grain.png" x="0" y="0" width="1080" height="1920" opacity=".45" style="mix-blend-mode:multiply"/>
 <g id="caps"></g>
</svg>
<script>window.READY=new Promise(r=>{window._res=r});
const src=["engine.js","k2kit.js","k3kit.js","k4kit.js","sbkit.js","sbkit2.js","sbkit3.js","sbkit4.js","sbplans.js"];
Promise.all([document.fonts.load("400 60px Anton"),document.fonts.load("400 60px Marker"),document.fonts.load("800 60px 'DM Sans'"),document.fonts.load("700 40px 'DM Sans'")]).then(async()=>{for(const s of src){await new Promise(res=>{const e=document.createElement("script");e.src=s;e.onload=res;document.body.appendChild(e)})}});
</script>
</body></html>
