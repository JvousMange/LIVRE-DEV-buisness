<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"DM Sans";font-weight:800;src:url(fonts/dm-sans-latin-800-normal.woff2)}
@font-face{font-family:"Anton";src:url(fonts/anton-latin-400-normal.woff2)}
html,body{margin:0;background:#000}svg{display:block}</style></head><body>
<svg id="stage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920"><defs>
<filter id="sh" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="9" stdDeviation="6" flood-color="#2a1305" flood-opacity=".34"/></filter>
<filter id="sh1" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="3.5" stdDeviation="2.6" flood-color="#2a1305" flood-opacity=".42"/></filter>
<filter id="sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="16" stdDeviation="11" flood-color="#2a1305" flood-opacity=".4"/></filter>
<pattern id="corr" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(32)"><line x1="0" y1="0" x2="0" y2="16" stroke="#2a1305" stroke-opacity=".10" stroke-width="6"/></pattern></defs>
<image href="kraft.jpg" x="0" y="0" width="1080" height="1920"/><g id="root"></g></svg>
<script>window.READY=new Promise(r=>{window._res=r});
Promise.all([document.fonts.load("400 60px Anton"),document.fonts.load("800 60px 'DM Sans'")]).then(async()=>{for(const s of ["engine.js","k2kit.js","k2human.js","k2humantest.js"]){await new Promise(res=>{const e=document.createElement("script");e.src=s;e.onload=res;document.body.appendChild(e)})}});
</script></body></html>
